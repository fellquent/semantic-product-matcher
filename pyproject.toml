[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-product-matcher"
version = "0.1.0"
description = "Hybrid product matching: embedding retrieval + LLM verification that is strict about numeric specs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["product matching", "semantic search", "embeddings", "faiss", "llm", "e-commerce"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "anthropic>=0.40",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.24",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
semantic-product-matcher = "semantic_product_matcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

